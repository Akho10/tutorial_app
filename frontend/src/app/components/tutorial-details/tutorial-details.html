@if (tutorial(); as current) {

  <div class="edit-form">

    <h4>Tutorial</h4>


    <div class="form-group">

      <label for="title">
        Title
      </label>

      <input
        type="text"
        class="form-control"
        id="title"
        [(ngModel)]="current.title"
        name="title"
      />

    </div>


    <div class="form-group">

      <label for="description">
        Description
      </label>

      <input
        type="text"
        class="form-control"
        id="description"
        [(ngModel)]="current.description"
        name="description"
      />

    </div>


    <div>

      <strong>Status:</strong>

      @if (current.published) {
        Published
      } @else {
        Pending
      }

    </div>


    @if (current.published) {

      <button
        type="button"
        class="btn btn-primary"
        (click)="updatePublished(false)">

        Unpublish

      </button>

    } @else {

      <button
        type="button"
        class="btn btn-primary"
        (click)="updatePublished(true)">

        Publish

      </button>

    }


    <button
      type="button"
      class="btn btn-danger"
      (click)="deleteTutorial()">

      Delete

    </button>


    <button
      type="button"
      class="btn btn-success"
      (click)="updateTutorial()">

      Update

    </button>


    @if (message()) {

      <p>
        {{ message() }}
      </p>

    }

  </div>

} @else {

  <p>
    Loading tutorial...
  </p>

}
