services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in deploy.env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in deploy.env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in deploy.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in deploy.env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --protocol=TCP -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    image: ${DOCKERHUB_USERNAME:?Set Docker Hub username}/tutorial-app-api:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:?Set MYSQL_DATABASE in deploy.env}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:?Set MYSQL_USER in deploy.env}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in deploy.env}
      SERVER_PORT: "8081"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8081"

  frontend:
    image: ${DOCKERHUB_USERNAME:?Set Docker Hub username}/tutorial-app-frontend:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "${APP_HTTP_PORT:-80}:80"
    depends_on:
      - api

  filebeat:
    image: docker.elastic.co/beats/filebeat:${ELASTIC_VERSION:-8.17.0}
    user: root
    command: ["--strict.perms=false"]
    restart: unless-stopped
    network_mode: host
    environment:
      LOGSTASH_HOST: ${LOGSTASH_HOST:?Set LOGSTASH_HOST to your local Logstash Tailscale IP}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - filebeat-data:/usr/share/filebeat/data

volumes:
  mysql-data:
  filebeat-data:
